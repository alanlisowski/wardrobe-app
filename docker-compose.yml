services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wardrobe
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: wardrobe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wardrobe"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-wardrobe}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-changeme123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  ml:
    build: ./services/ml
    ports:
      - "8000:8000"
    environment:
      PORT: 8000

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgres://wardrobe:${DB_PASSWORD:-changeme}@postgres:5432/wardrobe
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-wardrobe}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-changeme123}
      S3_BUCKET: wardrobe
      SESSION_SECRET: ${SESSION_SECRET:-dev-secret}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ML_SERVICE_URL: http://ml:8000
      API_PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      ml:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://wardrobe:${DB_PASSWORD:-changeme}@postgres:5432/wardrobe
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-wardrobe}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-changeme123}
      S3_BUCKET: wardrobe
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ML_SERVICE_URL: http://ml:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  miniodata:
